<!--
  THROWAWAY PROTOTYPE — issue #255 (part of map #254). Not production code. Double-click to open.

  Question (#255, sharpened by locked decision 6): how does a CONSTRAINED canvas render and edit
  a workflow body — an ordered sequence of nodes with nested blocks, a tree not a DAG — such that
  the author can never express a structure the block grammar cannot? Decision 6 is split between two
  live models and floats a hybrid; this prototype is what resolves that split:

    Variant A — DRILL-DOWN     (2026-08-19 amendment): one level at a time, single-click selects,
                                double-click descends, a back/breadcrumb stack ascends.
    Variant B — SCRATCH SNAP   (2026-08-21 proposal): every node a Lego block, wrappers are C-shaped,
                                all nesting inline and visible, a block only clicks into a legal socket.
    Variant C — HYBRID         (the reconciliation decision 6 itself floats): inline Scratch stacks
                                WITHIN a file, drill-down ONLY across a workflow-ref file boundary.

  All three render the SAME sample workflow (below) so they are directly comparable, and each answers
  the seven open questions from #255 the same way it would in the real Designer:
    (1) parallel block + its three join modes collect / wait-one / do-not-wait, shown and switched
    (2) branch block + where its conditions live
    (3) while-do + its mandatory max-iterations bound
    (4) where checkpoints sit — inline in the sequence, or attached to a node
    (5) sequence order expressed spatially + how it is reordered (drag / move within a container)
    (6) how nesting reads at depth 3+ without becoming unreadable  <-- the crux of the A-vs-B tension
    (7) the add-node gesture, and what an empty canvas offers

  Switch variants: floating bottom bar, the <- / -> arrow keys, or ?variant=A|B|C .
  No build, no server, no persistence — the workflow lives in memory and edits are lost on reload,
  which is the point (persistence is #257's job, not this prototype's). Precedent: the launch-panel
  prototype on map #40 (packages/viewer/src/launch-panel.prototype.html).
-->

<script>
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
//  Shared in-memory workflow model — the SAME body rendered by all three variants.
//  Grammar mirrors path/workflow@2: every node carries {id,name,kind}; a container slot holds
//  exactly one node, and a `sequence` carries the array where a slot needs several nodes in order.
//  This sample exercises all four logicers + checkpoints + a workflow-ref, and reaches depth 4.
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
let uid = 0; const gid = () => "id-" + (++uid).toString().padStart(4, "0"); // short readable ids for the sample
// A real UUIDv4 (ADR 0015). crypto.randomUUID needs a secure context (missing on file://), so fall
// back to getRandomValues, which is always available.
function uuidv4() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, "0"));
  return `${h[0]}${h[1]}${h[2]}${h[3]}-${h[4]}${h[5]}-${h[6]}${h[7]}-${h[8]}${h[9]}-${h[10]}${h[11]}${h[12]}${h[13]}${h[14]}${h[15]}`;
}

// A CONDITION is a structured typed AST (packages/schema/src/condition-type.ts) — NOT a text
// expression. Leaf predicates read a value at a `path` (a context./output. dot-path); all/any/not
// compose. The SAME Condition type is the branch arm's `when`, the while-do's `condition`, and the
// checkpoint's `condition` — so one builder authors all three.
const cExists    = path            => ({ type: "exists", path });
const cEquals    = (path, value)   => ({ type: "equals", path, value });
const cOneOf     = (path, values)  => ({ type: "one-of", path, values });
const cMatches   = (path, pattern) => ({ type: "matches", path, pattern });
const cRange     = (path, min, max)=> ({ type: "range", path, ...(min != null ? { min } : {}), ...(max != null ? { max } : {}) });
const cValidJson = path            => ({ type: "valid-json", path });
const cAll       = (...of)         => ({ type: "all", of });
const cAny       = (...of)         => ({ type: "any", of });
const cNot       = of              => ({ type: "not", of });
const LEAF_TYPES = ["exists","equals","one-of","matches","range","valid-json"];
const COMBO_TYPES = ["all","any","not"];

const step  = (name, note)               => ({ id: gid(), name, kind: "step", note });
const check = (name, condition)          => ({ id: gid(), name, kind: "checkpoint", condition });   // condition: Condition
const seq   = (name, nodes)              => ({ id: gid(), name, kind: "sequence", nodes });
// A parallel branch IS a node (@2, node-type.ts): its own `name` is the collect/wait-one output key —
// there is no separate arm name. So `parallel.branches` is a plain node array. A branch logicer's arm,
// by contrast, wraps a node with its own `when` condition.
const par   = (name, join, branches)     => ({ id: gid(), name, kind: "parallel", join, branches }); // branches: node[]
const branch= (name, arms, elseNode)     => ({ id: gid(), name, kind: "branch", arms, else: elseNode }); // arms: [{when:Condition,node}], else?: node
const whilez= (name, condition, maxIter, body) => ({ id: gid(), name, kind: "while-do", condition, maxIter, body }); // condition: Condition
const wfref = (name, ref)                => ({ id: gid(), name, kind: "workflow", ref });

const MODEL = seq("release-pipeline", [
  step("fetch-source", "clone + checkout the release ref"),
  check("assert-source-present", cExists("context.source_dir")),
  par("verify", "collect", [                                           // branch keys = these nodes' names
    seq("lint", [ step("run-lint", "eslint --max-warnings 0"), check("lint-clean", cEquals("output.exit_code", 0)) ]),
    whilez("test", cEquals("output.status", "flaky"), 3, step("run-flaky-tests", "pytest -q; may flake")),
    step("build", "docker build -t rel:$sha ."),
  ]),
  branch("route-deploy", [
    { when: cEquals("context.target", "prod"),    node: par("ship-prod", "wait-one", [
        step("us", "push to us-east-1"),
        step("eu", "push to eu-west-1"),
    ]) },
    { when: cEquals("context.target", "staging"), node: step("deploy-staging", "push to staging") },
  ], check("no-target", cExists("context.target"))), // else arm is a single node, not a when-arm
  check("assert-deployed", cRange("output.http_status", 200, 299)),
  wfref("notify-team", "./notify.workflow.json"),
]);

// A second file, reached only through the workflow-ref — lets variant C demo the file-boundary drill-down.
const NOTIFY_FILE = seq("notify", [
  step("render-message", "template the release notes"),
  par("fan-out", "do-not-wait", [
    step("slack", "chat.postMessage"),
    step("email", "SES send"),
  ]),
]);

const KIND_LABEL = { step:"step", checkpoint:"checkpoint", parallel:"parallel", branch:"branch",
  "while-do":"while-do", sequence:"sequence", workflow:"workflow-ref" };
const KVAR = { step:"--k-step", checkpoint:"--k-checkpoint", parallel:"--k-parallel", branch:"--k-branch",
  "while-do":"--k-while", sequence:"--k-sequence", workflow:"--k-workflow" };
const isContainer = n => ["parallel","branch","while-do","sequence","workflow"].includes(n.kind);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
function kindChip(kind) { const c = el("span", "kind " + kind, KIND_LABEL[kind]); return c; }

// Shared selection + a tiny toast so every mutation "surfaces the state" (skill rule 5).
let selectedId = null;
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = el("div"); t.id = "toast"; Object.assign(t.style, { position:"fixed", bottom:"64px", left:"50%",
    transform:"translateX(-50%)", background:"#1c2128", color:"#fff", padding:"7px 14px", borderRadius:"8px",
    fontSize:"12px", zIndex:60, opacity:0, transition:"opacity .15s", pointerEvents:"none", maxWidth:"70vw", textAlign:"center" });
    document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 1600);
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
//  CONDITION toolkit — a compact read-only summary + a structured builder. Answers "how do I input
//  the condition?" for branch `when`, while-do `condition`, and checkpoint `condition`: you do NOT
//  type an expression; you pick an operator + a path + operands, or compose with all/any/not.
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
function jsonScalar(s) { // parse an operand input into a JSON scalar (number/bool/null/string)
  const t = s.trim();
  if (t === "true") return true; if (t === "false") return false; if (t === "null") return null;
  if (t !== "" && !isNaN(Number(t))) return Number(t);
  return s;
}
function condSummary(c) {
  if (!c) return "—";
  switch (c.type) {
    case "exists":     return `${c.path} exists`;
    case "equals":     return `${c.path} == ${JSON.stringify(c.value)}`;
    case "one-of":     return `${c.path} in [${(c.values||[]).map(v=>JSON.stringify(v)).join(", ")}]`;
    case "matches":    return `${c.path} ~ /${c.pattern}/`;
    case "range":      return `${c.path} ∈ [${c.min ?? "−∞"}..${c.max ?? "+∞"}]`;
    case "valid-json": return `${c.path} is valid-json`;
    case "all":        return "(" + (c.of||[]).map(condSummary).join(" AND ") + ")";
    case "any":        return "(" + (c.of||[]).map(condSummary).join(" OR ")  + ")";
    case "not":        return "NOT " + condSummary(c.of);
    default:           return "?";
  }
}
// setCond(newCond) replaces this node in its parent; onEdit fires after any mutation to re-render.
function renderCondEditor(cond, setCond, onEdit, depth = 0) {
  const box = el("div", "cond-node"); box.style.marginLeft = depth ? "12px" : "0";
  const row = el("div", "cond-row");
  const typeSel = el("select", "cond-type");
  [...LEAF_TYPES, "—", ...COMBO_TYPES].forEach(t => { const o = el("option", null, t); if (t === "—") o.disabled = true; o.value = t; if (t === cond.type) o.selected = true; typeSel.appendChild(o); });
  typeSel.onchange = () => {
    const nt = typeSel.value; let next;
    if (LEAF_TYPES.includes(nt)) {
      const path = cond.path || "context.field";
      next = nt === "equals" ? cEquals(path, "") : nt === "one-of" ? cOneOf(path, [""]) : nt === "matches" ? cMatches(path, ".*")
        : nt === "range" ? cRange(path, 0, null) : nt === "valid-json" ? cValidJson(path) : cExists(path);
    } else if (nt === "not") next = cNot(LEAF_TYPES.includes(cond.type) ? cond : cExists("context.field"));
    else next = { type: nt, of: cond.of || [LEAF_TYPES.includes(cond.type) ? cond : cExists("context.field")] };
    setCond(next); onEdit();
  };
  row.appendChild(typeSel);

  if (LEAF_TYPES.includes(cond.type)) {
    const path = el("input", "cond-path"); path.value = cond.path || ""; path.placeholder = "context.field | output.field";
    path.onchange = () => { cond.path = path.value; onEdit(); };
    row.appendChild(path);
    if (cond.type === "equals") { const v = el("input", "cond-op"); v.value = String(cond.value ?? ""); v.placeholder = "value"; v.onchange = () => { cond.value = jsonScalar(v.value); onEdit(); }; row.appendChild(v); }
    if (cond.type === "one-of") { const v = el("input", "cond-op"); v.value = (cond.values||[]).join(", "); v.placeholder = "a, b, c"; v.onchange = () => { cond.values = v.value.split(",").map(s => jsonScalar(s)); onEdit(); }; row.appendChild(v); }
    if (cond.type === "matches") { const v = el("input", "cond-op"); v.value = cond.pattern || ""; v.placeholder = "regex"; v.onchange = () => { cond.pattern = v.value; onEdit(); }; row.appendChild(v); }
    if (cond.type === "range") {
      const mn = el("input", "cond-op"); mn.style.width = "56px"; mn.value = cond.min ?? ""; mn.placeholder = "min"; mn.onchange = () => { const n = mn.value.trim(); if (n === "") delete cond.min; else cond.min = Number(n); onEdit(); };
      const mx = el("input", "cond-op"); mx.style.width = "56px"; mx.value = cond.max ?? ""; mx.placeholder = "max"; mx.onchange = () => { const n = mx.value.trim(); if (n === "") delete cond.max; else cond.max = Number(n); onEdit(); };
      row.append(mn, mx);
    }
    box.appendChild(row);
  } else if (cond.type === "not") {
    box.appendChild(row);
    box.appendChild(renderCondEditor(cond.of, nc => { cond.of = nc; }, onEdit, depth + 1));
  } else { // all / any
    box.appendChild(row);
    cond.of.forEach((child, i) => {
      const holder = renderCondEditor(child, nc => { cond.of[i] = nc; }, onEdit, depth + 1);
      const rm = el("button", "cond-rm", "×"); rm.title = "remove"; rm.onclick = () => { cond.of.splice(i, 1); if (!cond.of.length) cond.of.push(cExists("context.field")); onEdit(); };
      holder.querySelector(".cond-row")?.appendChild(rm);
      box.appendChild(holder);
    });
    const addC = el("button", "cond-add", "＋ condition"); addC.style.marginLeft = ((depth + 1) * 12) + "px";
    addC.onclick = () => { cond.of.push(cExists("context.field")); onEdit(); };
    box.appendChild(addC);
  }
  return box;
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
//  VARIANT A — DRILL-DOWN. One level at a time. Single-click selects, double-click descends,
//  breadcrumb stack ascends. Containers show N arms side by side AT that level; a block costs
//  exactly one level of depth. Right pane = properties of the selected node (or the level itself).
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
let aStack = [MODEL]; // navigation stack; top = current level container

function renderA(stage) {
  activeRoot = MODEL;
  // Drop any level whose node was deleted out from under the navigation stack.
  aStack = aStack.filter(n => n && (n === MODEL || findNode(MODEL, n.id))); if (!aStack.length) aStack = [MODEL];
  const cur = aStack[aStack.length - 1];
  stage.innerHTML = "";
  const canvas = el("div", "canvas");
  const pane = el("div", "pane");

  // breadcrumb
  const bc = el("div", "a-breadcrumb");
  aStack.forEach((node, i) => {
    if (i) bc.appendChild(el("span", "sep", "›"));
    if (i === aStack.length - 1) { const s = el("span", "cur", node.name); bc.appendChild(s); }
    else { const b = el("button", null, node.name); b.onclick = () => { aStack = aStack.slice(0, i + 1); renderA(stage); }; bc.appendChild(b); }
  });
  canvas.appendChild(bc);

  const level = el("div", "a-level");
  level.onclick = e => { if (e.target === level) { selectedId = cur.id; renderA(stage); } }; // click empty -> select level itself
  level.appendChild(el("p", "a-level-head", `Editing ${KIND_LABEL[cur.kind]} “${cur.name}” · double-click a container to descend`));

  const descend = node => { aStack = [...aStack, node]; selectedId = null; renderA(stage); };
  const selectNode = node => { selectedId = node.id; renderA(stage); };

  // Add-arm column for a parallel/branch level (question — "how do I add a parallel branch?").
  const addArmCol = block => {
    const col = el("div", "a-arm"); col.style.borderStyle = "dashed";
    const b = el("button", "a-add", block.kind === "parallel" ? "＋ add parallel branch" : "＋ add branch arm");
    b.style.margin = "0";
    b.onclick = () => {
      if (block.kind === "parallel") { const nm = "branch-" + (block.branches.length + 1); block.branches.push(step(nm, "todo")); toast("Added parallel branch “" + nm + "”"); }
      else { block.arms.push({ when: cExists("context.field"), node: step("arm-step", "todo") }); toast("Added branch arm (else stays last)"); }
      renderA(stage);
    };
    col.appendChild(b); return col;
  };

  const nodeRow = (node, idx) => {
    const row = el("div", "a-node" + (node.id === selectedId ? " sel" : ""));
    if (idx != null) row.appendChild(el("span", "idx", idx + 1));
    row.appendChild(kindChip(node.kind));
    row.appendChild(el("span", "nm", node.name));
    if (isContainer(node)) { const d = el("span", "desc-badge", "double-click to open ▸"); row.appendChild(d); }
    const xb = el("button", "node-x", "×"); xb.title = "delete this node"; xb.style.marginLeft = isContainer(node) ? "8px" : "auto";
    xb.onclick = e => { e.stopPropagation(); deleteSelected(node.id); };
    row.appendChild(xb);
    row.onclick = e => { e.stopPropagation(); selectNode(node); };
    row.ondblclick = e => { e.stopPropagation(); if (isContainer(node)) descend(node); };
    return row;
  };

  // Render current level. A sequence shows an ordered, reorderable list; the block kinds show arms side by side.
  if (cur.kind === "sequence") {
    cur.nodes.forEach((n, i) => level.appendChild(nodeRow(n, i)));
    const add = el("button", "a-add", "＋ add node here  (step · checkpoint · parallel · branch · while-do)");
    add.onclick = () => { cur.nodes.push(step("new-step", "todo")); toast("Added step to “" + cur.name + "”"); renderA(stage); };
    level.appendChild(add);
  } else if (cur.kind === "parallel") {
    const wrap = el("div", "a-arms");
    cur.branches.forEach(bnode => {                          // a parallel branch is just a node; its name is the key
      const col = el("div", "a-arm");
      col.appendChild(el("div", "arm-label", "parallel branch"));
      col.appendChild(nodeRow(bnode));
      wrap.appendChild(col);
    });
    wrap.appendChild(addArmCol(cur));
    level.appendChild(wrap);
  } else if (cur.kind === "branch") {
    const wrap = el("div", "a-arms");
    cur.arms.forEach(arm => {
      const col = el("div", "a-arm");
      const lbl = el("div", "arm-label"); lbl.append("when "); const c = el("code"); c.textContent = condSummary(arm.when); c.style.color = "var(--k-branch)"; lbl.appendChild(c); col.appendChild(lbl);
      col.appendChild(nodeRow(arm.node));
      wrap.appendChild(col);
    });
    if (cur.else) { const col = el("div", "a-arm"); col.appendChild(el("div", "arm-label", "else (no arm matched)")); col.appendChild(nodeRow(cur.else)); wrap.appendChild(col); }
    wrap.appendChild(addArmCol(cur));
    level.appendChild(wrap);
  } else if (cur.kind === "while-do") {
    const cl = el("p", "arm-label"); cl.append("while "); const cc = el("code"); cc.textContent = condSummary(cur.condition); cc.style.color = "var(--k-while)"; cl.appendChild(cc); cl.append(" — max " + cur.maxIter + " iters. Loop body:"); level.appendChild(cl);
    level.appendChild(nodeRow(cur.body));
  } else if (cur.kind === "workflow") {
    level.appendChild(el("p", "hint", "This is a workflow-ref — its body lives in another file (" + cur.ref + ") behind a separate write precondition and edit lease. Descending crosses files."));
  }

  canvas.appendChild(level);
  stage.appendChild(canvas);
  stage.appendChild(paneFor(selectedId ? findNode(MODEL, selectedId) || cur : cur, "A", MODEL));
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
//  VARIANT B — SCRATCH SNAP. Every node a block; wrappers (parallel/branch/while-do) are C-shaped
//  with the body nested INSIDE their mouth. Everything visible inline at every depth. The palette
//  offers block types; a socket lights green (legal) or red (illegal) — an illegal structure is
//  literally unsnappable, which is the constraint made physical.
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
function renderScratchBlock(node, opts = {}) {
  const kc = `var(${KVAR[node.kind]})`;
  const leaf = !isContainer(node) || node.kind === "workflow";
  const wrap = el("div", "sblock" + (leaf ? " leaf" : "") + (node.id === selectedId ? " sel" : ""));
  wrap.style.setProperty("--kc", kc);

  if (node.kind === "workflow") { // a ref renders as a chip even in pure-inline B (its body is another file)
    const chip = el("div", "refchip");
    const ctl = el("span", "ctl-slot");                     // leading cluster so delete is reachable even when the ref path makes the chip overflow
    const cx = el("button", "node-x", "×"); cx.title = "delete this workflow-ref node (the ref'd file is untouched)";
    cx.onclick = e => { e.stopPropagation(); deleteSelected(node.id); };
    ctl.appendChild(cx);
    chip.appendChild(ctl);
    chip.appendChild(kindChip("workflow"));
    chip.appendChild(Object.assign(el("b"), { textContent: node.name }));
    const r = el("code"); r.textContent = node.ref; r.style.fontSize = "11px"; r.style.color = "var(--text-muted)"; chip.appendChild(r);
    chip.appendChild(el("span", "cross", opts.hybrid ? "descend ↳" : "another file"));
    chip.onclick = e => { e.stopPropagation(); selectedId = node.id; opts.rerender(); if (opts.hybrid && opts.onDescend) opts.onDescend(node); };
    return chip;
  }

  const hat = el("div", "hat"); hat.style.setProperty("--kc", kc);
  const ctl = el("span", "ctl-slot");                       // leading: delete (+ reorder, injected by renderStack) — always visible regardless of block width
  if (node.id !== opts.rootId) {                            // the file body root can't be deleted, so it shows no ×
    const xb = el("button", "node-x", "×"); xb.title = "delete this node";
    xb.onclick = e => { e.stopPropagation(); deleteSelected(node.id); };
    ctl.appendChild(xb);
  }
  hat.appendChild(ctl);
  hat.appendChild(kindChip(node.kind));
  hat.appendChild(Object.assign(el("span", "nm"), { textContent: node.name }));
  const drop = el("span", "drop");

  if (node.kind === "parallel") { // read-only join badge; join is edited in PROPERTIES (structure vs content)
    const jb = el("span", "joinpill", "join: " + node.join); jb.style.cursor = "default"; drop.appendChild(jb);
  }
  if (node.kind === "while-do") { // read-only summary on the block; max-iter is edited in PROPERTIES only
    const wc = el("span", "cond"); wc.textContent = "while " + condSummary(node.condition) + " · max " + node.maxIter + " iters"; wc.style.marginLeft = "6px"; drop.appendChild(wc);
  }
  if (node.kind === "checkpoint") { // the assertion is a structured condition; summary sits on the hat (question 4)
    const cc = el("span", "cond"); cc.textContent = "assert " + condSummary(node.condition); drop.appendChild(cc);
  }
  hat.appendChild(drop);
  hat.onclick = e => { e.stopPropagation(); selectedId = node.id; opts.rerender(); };
  wrap.appendChild(hat);

  if (leaf) return wrap;

  // Container mouth.
  const mouth = el("div", "mouth"); mouth.style.setProperty("--kc", kc);
  if (node.kind === "sequence") {
    mouth.appendChild(renderStack(node.nodes, node, opts));
  } else if (node.kind === "while-do") {
    mouth.appendChild(renderScratchBlock(node.body, opts));
  } else if (node.kind === "parallel" || node.kind === "branch") {
    const row = el("div", "arm-row");
    // Each column: a caption that selects the occupant, then the occupant block. A parallel branch's
    // caption is just "parallel branch" (its name is the node name, shown on the block); a branch arm's
    // caption is its `when` condition (question 2).
    const armColumn = (captionText, isCond, occupant) => {
      const col = el("div", "arm-col");
      const head = el("div", "arm-head");
      if (isCond) { head.append("when "); const c = el("span", "cond"); c.textContent = captionText; head.appendChild(c); }
      else head.textContent = captionText;
      head.style.cursor = "pointer"; head.title = "select this branch/arm";
      head.onclick = e => { e.stopPropagation(); selectedId = occupant.id; opts.rerender(); };
      col.appendChild(head);
      col.appendChild(renderScratchBlock(occupant, opts));
      return col;
    };
    if (node.kind === "parallel") node.branches.forEach(b => row.appendChild(armColumn("parallel branch", false, b)));
    else {
      node.arms.forEach(arm => row.appendChild(armColumn(condSummary(arm.when), true, arm.node)));
      if (node.else) row.appendChild(armColumn("else", false, node.else));
    }
    // Add-arm affordance: a trailing column that adds a NEW branch/arm. A parallel branch is a bare
    // node (its name is the key); a branch arm wraps a node with a `when`.
    const addCol = el("div", "arm-col");
    addCol.appendChild(el("div", "arm-head", node.kind === "parallel" ? "new branch" : "new arm"));
    const addSock = el("div", "socket");
    addSock.textContent = node.kind === "parallel" ? "＋ add parallel branch" : "＋ add branch arm";
    addSock.style.cursor = "pointer"; addSock.style.minHeight = "42px"; addSock.style.display = "flex";
    addSock.style.alignItems = "center"; addSock.style.justifyContent = "center";
    const addOf = maker => {
      if (node.kind === "parallel") { const nm = "branch-" + (node.branches.length + 1); node.branches.push(maker(nm)); toast("Added parallel branch to “" + node.name + "”"); }
      else { node.arms.push({ when: cExists("context.field"), node: maker("arm-step") }); toast("Added branch arm to “" + node.name + "” (else stays the fallback)"); }
      opts.rerender();
    };
    addSock.onclick = e => { e.stopPropagation(); addOf(nm => step(nm, "todo")); };
    addSock.ondragover = ev => { ev.preventDefault(); addSock.classList.add("legal-hover"); };
    addSock.ondragleave = () => addSock.classList.remove("legal-hover");
    addSock.ondrop = ev => { ev.preventDefault(); addSock.classList.remove("legal-hover"); const k = window._dragKind; if (!k) return; addOf(() => makeDefault(k)); };
    addCol.appendChild(addSock);
    row.appendChild(addCol);
    mouth.appendChild(row);
  }
  wrap.appendChild(mouth);
  return wrap;
}

// A reorderable stack of blocks (question 5: sequence order is vertical position; ↑/↓ reorder,
// and a socket at the bottom accepts a dropped palette block).
function renderStack(nodes, parent, opts) {
  const stack = el("div", "stack");
  nodes.forEach((n, i) => {
    const b = renderScratchBlock(n, opts);
    // Reorder controls join the leading cluster next to delete, so both live in one always-visible spot.
    const slot = b.querySelector(".ctl-slot");
    const mk = (t, dir, dis) => { const x = el("button", "joinpill", t); x.style.padding = "0 5px"; if (dis) x.disabled = true;
      x.title = dir < 0 ? "move up" : "move down";
      x.onclick = e => { e.stopPropagation(); const j = i + dir; [nodes[i], nodes[j]] = [nodes[j], nodes[i]]; toast("Reordered within “" + parent.name + "”"); opts.rerender(); }; return x; };
    if (slot) slot.prepend(mk("↑", -1, i === 0), mk("↓", 1, i === nodes.length - 1));
    stack.appendChild(b);
  });
  // legal socket at the end of the sequence
  const sock = el("div", "socket", "▽ drop a step / checkpoint / block here  (legal socket)");
  sock.ondragover = e => { e.preventDefault(); sock.classList.toggle("legal-hover", window._dragKind !== "workflow"); sock.classList.toggle("illegal-hover", window._dragKind === "workflow"); };
  sock.ondragleave = () => sock.classList.remove("legal-hover", "illegal-hover");
  sock.ondrop = e => { e.preventDefault(); sock.classList.remove("legal-hover", "illegal-hover");
    const k = window._dragKind; if (!k) return;
    nodes.push(makeDefault(k)); toast("Snapped a " + KIND_LABEL[k] + " into “" + parent.name + "”"); opts.rerender(); };
  stack.appendChild(sock);
  return stack;
}

function makeDefault(kind) {
  switch (kind) {
    case "step": return step("new-step", "todo");
    case "checkpoint": return check("new-check", cExists("context.field"));
    case "parallel": return par("new-parallel", "collect", [step("a", ""), step("b", "")]);
    case "branch": return branch("new-branch", [{ when: cExists("context.field"), node: step("a", "") }], step("b", ""));
    case "while-do": return whilez("new-loop", cExists("context.field"), 5, step("body", ""));
    case "sequence": return seq("new-seq", [step("a", "")]);
    default: return step("new-step", "");
  }
}

function renderB(stage) {
  activeRoot = MODEL;
  stage.innerHTML = "";
  const wrap = el("div", "scratch-wrap");
  wrap.appendChild(palette(false));
  const canvas = el("div", "scratch-canvas canvas");
  const opts = { rerender: () => renderB(stage), rootId: MODEL.id };
  canvas.onclick = e => { if (e.target === canvas) { selectedId = null; renderB(stage); } };
  canvas.appendChild(renderScratchBlock(MODEL, opts));
  wrap.appendChild(canvas);
  stage.appendChild(wrap);
  stage.appendChild(paneFor(selectedId ? findNode(MODEL, selectedId) : MODEL, "B", MODEL));
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
//  VARIANT C — HYBRID. Inline Scratch stacks WITHIN a file (readable at depth via the same blocks),
//  but a workflow-ref is the ONE boundary you drill across: double-click the ref chip and the whole
//  canvas swaps to that file's body, a file breadcrumb tracks the crossing. Blocks stay inline; only
//  the file boundary costs a navigation hop (which it must — a ref is a separate file + lease anyway).
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
let cFileStack = [{ name: "release-pipeline.workflow.json", body: MODEL }];

function renderC(stage) {
  const cur = cFileStack[cFileStack.length - 1];
  activeRoot = cur.body;
  document.getElementById("chrome-file").textContent = cur.name;
  stage.innerHTML = "";
  const wrap = el("div", "scratch-wrap");
  wrap.appendChild(palette(true));
  const right = el("div"); right.style.cssText = "flex:1;display:flex;flex-direction:column;min-width:0";

  // file breadcrumb — the only drill-down axis in the hybrid
  const fb = el("div", "c-filebar");
  fb.appendChild(el("span", null, "file:"));
  cFileStack.forEach((f, i) => {
    if (i) fb.appendChild(el("span", "sep", "›"));
    if (i === cFileStack.length - 1) fb.appendChild(el("span", "curfile", f.name));
    else { const b = el("button", null, f.name); b.onclick = () => { cFileStack = cFileStack.slice(0, i + 1); selectedId = null; renderC(stage); }; fb.appendChild(b); }
  });
  if (cFileStack.length > 1) { const note = el("span", "sep", "· separate write precondition + edit lease per file (#257/#258)"); note.style.marginLeft = "auto"; note.style.fontSize = "11px"; fb.appendChild(note); }

  const canvas = el("div", "scratch-canvas canvas");
  const opts = { rerender: () => renderC(stage), hybrid: true, rootId: cur.body.id, onDescend: node => {
    const target = node.ref === "./notify.workflow.json" ? NOTIFY_FILE : seq(node.name, [step("(empty)", "")]);
    cFileStack = [...cFileStack, { name: node.ref.replace("./",""), body: target }]; selectedId = null; renderC(stage);
    toast("Crossed file boundary into " + node.ref);
  } };
  canvas.onclick = e => { if (e.target === canvas) { selectedId = null; renderC(stage); } };
  canvas.appendChild(renderScratchBlock(cur.body, opts));

  right.appendChild(fb); right.appendChild(canvas);
  wrap.appendChild(right);
  stage.appendChild(wrap);
  stage.appendChild(paneFor(selectedId ? findNode(cur.body, selectedId) : cur.body, "C", cur.body));
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
//  Shared bits: palette, properties pane, node lookup.
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
function palette(hybrid) {
  const p = el("div", "palette");
  p.appendChild(el("h3", null, "blocks"));
  const kinds = ["step", "checkpoint", "parallel", "branch", "while-do", "sequence"];
  kinds.forEach(k => {
    const b = el("div", "blk"); b.style.background = `var(${KVAR[k]}-bg, var(--surface))`; b.style.color = `var(${KVAR[k]})`;
    b.appendChild(kindChip(k)); b.draggable = true;
    b.ondragstart = () => { window._dragKind = k; };
    b.ondragend = () => { window._dragKind = null; };
    p.appendChild(b);
  });
  // workflow-ref shown but marked: it snaps in, but its body is a separate file
  const wf = el("div", "blk illegal"); wf.appendChild(kindChip("workflow")); wf.title = "a ref points at another file; add via New-file flow";
  p.appendChild(wf);
  p.appendChild(el("div", "legalnote", hybrid
    ? "Drag a block into any legal socket. A socket only accepts what the grammar allows there, so an illegal tree is unsnappable. A workflow-ref is the one block you descend into (double-click)."
    : "Drag a block into any legal socket. A socket only accepts what the grammar allows there — an illegal structure is physically unsnappable. Sockets glow green (legal) or red (illegal) as you drag."));
  return p;
}

function findNode(root, id) {
  if (!root) return null;
  if (root.id === id) return root;
  const kids = root.kind === "sequence" ? root.nodes
    : root.kind === "while-do" ? [root.body]
    : root.kind === "branch" ? [...root.arms.map(a => a.node), ...(root.else ? [root.else] : [])]
    : root.kind === "parallel" ? root.branches : [];
  for (const k of kids) { const f = findNode(k, id); if (f) return f; }
  return null;
}

// The arm/branch a node occupies, if any — so a branch arm's `when` is edited where the node is
// selected. A parallel branch has no separate metadata (its name IS the node name), so it just
// reports which parallel it belongs to.
function findArmContext(root, id) {
  if (!root) return null;
  if (root.kind === "parallel") {
    for (let i = 0; i < root.branches.length; i++) if (root.branches[i].id === id) return { block: root, index: i };
  }
  if (root.kind === "branch") {
    for (let i = 0; i < root.arms.length; i++) if (root.arms[i].node.id === id) return { block: root, arm: root.arms[i], index: i };
    if (root.else && root.else.id === id) return { block: root, isElse: true };
  }
  const kids = root.kind === "sequence" ? root.nodes
    : root.kind === "while-do" ? [root.body]
    : root.kind === "branch" ? [...root.arms.map(a => a.node), ...(root.else ? [root.else] : [])]
    : root.kind === "parallel" ? root.branches : [];
  for (const k of kids) { const f = findArmContext(k, id); if (f) return f; }
  return null;
}

// The file body the active variant is editing — set at each render so the delete key / inline × know
// which tree to search.
let activeRoot = MODEL;

// Locate a node's deletion slot: a sequence entry, an arm occupant, a branch else, or a while-do body.
// Returns a `remove()` closure plus slot metadata so deleteNode can enforce the single-node-slot rules.
function nodeDeleter(root, id) {
  const visit = n => {
    if (n.kind === "sequence") {
      for (let i = 0; i < n.nodes.length; i++) { if (n.nodes[i].id === id) return { slot: "sequence", parent: n, remove: () => n.nodes.splice(i, 1) }; const r = visit(n.nodes[i]); if (r) return r; }
    } else if (n.kind === "while-do") {
      if (n.body.id === id) return { slot: "while-body", parent: n };
      const r = visit(n.body); if (r) return r;
    } else if (n.kind === "parallel") {
      for (let i = 0; i < n.branches.length; i++) { if (n.branches[i].id === id) return { slot: "parallel-arm", parent: n, count: n.branches.length, remove: () => n.branches.splice(i, 1) }; const r = visit(n.branches[i]); if (r) return r; }
    } else if (n.kind === "branch") {
      for (let i = 0; i < n.arms.length; i++) { if (n.arms[i].node.id === id) return { slot: "branch-arm", parent: n, count: n.arms.length, remove: () => n.arms.splice(i, 1) }; const r = visit(n.arms[i].node); if (r) return r; }
      if (n.else && n.else.id === id) return { slot: "branch-else", parent: n, remove: () => { delete n.else; } };
      if (n.else) { const r = visit(n.else); if (r) return r; }
    }
    return null;
  };
  return visit(root);
}

// Delete a node, honoring the grammar: a slot cannot be left empty (@2 single-node slots), a while-do
// body is mandatory (so deleting it deletes the loop), and the workflow body itself is undeletable.
function deleteNode(root, id) {
  if (root.id === id) return { ok: false, msg: "Can't delete the workflow body itself." };
  const ctx = nodeDeleter(root, id);
  if (!ctx) return { ok: false, msg: "Node not found in this file." };
  if (ctx.slot === "while-body") { const r = deleteNode(root, ctx.parent.id); return r.ok ? { ok: true, msg: "Loop body is a mandatory slot — deleted the whole while-do." } : r; }
  if (ctx.slot === "parallel-arm" && ctx.count <= 1) return { ok: false, msg: "A parallel needs at least one branch — delete the parallel block instead." };
  if (ctx.slot === "branch-arm" && ctx.count <= 1 && !ctx.parent.else) return { ok: false, msg: "A branch needs an arm or an else — delete the branch block instead." };
  ctx.remove();
  const what = ctx.slot === "parallel-arm" ? "parallel branch" : ctx.slot === "branch-arm" ? "branch arm" : ctx.slot === "branch-else" ? "else fallback" : "node";
  return { ok: true, msg: "Deleted " + what + "." };
}

// Delete the selected node against the active file body, then clear selection and re-render.
function deleteSelected(id) {
  if (!id) return;
  const r = deleteNode(activeRoot, id);
  toast(r.msg);
  if (r.ok) selectedId = null;
  rerender();
}

function paneFor(node, variant, root) {
  const armCtx = node ? findArmContext(root, node.id) : null;
  const pane = el("div", "pane");
  if (!node) { pane.appendChild(el("p", "hint", "Nothing selected. Click a node to edit its properties; click empty canvas to edit the level/file itself.")); return pane; }
  pane.appendChild(el("h3", null, "properties"));
  const head = el("div"); head.style.margin = "6px 0 10px"; head.appendChild(kindChip(node.kind));
  head.append(" "); head.appendChild(Object.assign(el("b"), { textContent: node.name })); pane.appendChild(head);

  // Editable name — the human label (^[a-z][a-z0-9-]*$, unique per file). Renaming never touches the id.
  pane.appendChild(Object.assign(el("label"), { textContent: "name" }));
  const nameIn = el("input"); nameIn.value = node.name; nameIn.spellcheck = false;
  const nameWarn = el("p", "hint"); nameWarn.style.color = "var(--status-failed-fg)"; nameWarn.style.display = "none";
  nameIn.oninput = () => { const ok = /^[a-z][a-z0-9-]*$/.test(nameIn.value); nameWarn.style.display = ok ? "none" : "block"; nameWarn.textContent = "must match ^[a-z][a-z0-9-]*$"; };
  nameIn.onchange = () => { if (/^[a-z][a-z0-9-]*$/.test(nameIn.value)) { node.name = nameIn.value; toast("renamed → " + node.name); rerender(); } };
  pane.append(nameIn, nameWarn);

  // Editable id — the durable UUID (ADR 0015: client-minted, preserved across rename/reorder/reparent).
  // The ⟳ button mints a fresh GUID; normally the id is stable, so this is a deliberate re-key.
  pane.appendChild(Object.assign(el("label"), { textContent: "id (node GUID)" }));
  const idRow = el("div"); idRow.style.cssText = "display:flex;gap:6px;align-items:center";
  const idIn = el("input"); idIn.value = node.id; idIn.spellcheck = false; idIn.style.fontFamily = "var(--font-mono)"; idIn.style.fontSize = "var(--fs-xs)";
  // Changing the id must move the selection with it, or findNode() loses the node after re-key.
  idIn.onchange = () => { const v = idIn.value.trim(); if (v) { node.id = v; if (selectedId != null) selectedId = v; toast("id set"); rerender(); } };
  const idGen = el("button", "joinpill", "⟳ new GUID"); idGen.style.whiteSpace = "nowrap"; idGen.title = "mint a fresh UUIDv4";
  idGen.onclick = () => {
    // Re-keying breaks resume's plan-reuse match for this node (ADR 0015: the id is normally stable),
    // so gate it behind a confirm rather than mutating on a single click.
    const ok = confirm("Mint a new GUID for “" + node.name + "”?\n\nThe id is normally stable. Re-keying breaks resume's plan-reuse for this node — a resumed run will re-execute it instead of reusing its output. This cannot be undone.");
    if (!ok) return;
    node.id = uuidv4(); if (selectedId != null) selectedId = node.id; toast("new GUID minted"); rerender();
  };
  idRow.append(idIn, idGen); pane.appendChild(idRow);

  const kv = el("dl", "kv");
  const add = (k, v) => { kv.appendChild(el("dt", null, k)); kv.appendChild(el("dd", null, v)); };
  if (node.note) add("payload", node.note);
  if (node.ref) add("ref", node.ref);                       // workflow-ref — file boundary
  if (node.kind === "parallel") add("branches", node.branches.map(b => b.name).join(", "));
  if (node.kind === "sequence") add("length", node.nodes.length + " nodes");
  pane.appendChild(kv);

  // A structured condition builder, reused everywhere a Condition is authored: branch `when`,
  // while-do `condition`, checkpoint `condition`. You never type an expression — you pick an
  // operator + a context./output. path + operands, or compose with all/any/not.
  const condEditor = (labelTxt, getC, setC, help) => {
    pane.appendChild(Object.assign(el("label"), { textContent: labelTxt }));
    pane.appendChild(el("div", "cond-preview", condSummary(getC())));      // read-back summary
    const onEdit = () => { toast("condition updated"); rerender(); };       // rerender rebuilds the pane from state
    pane.appendChild(renderCondEditor(getC(), nc => setC(nc), onEdit));
    if (help) pane.appendChild(el("p", "hint", help));
  };

  // Arm metadata: a branch arm owns its `when` (edited here); a parallel branch owns nothing extra —
  // its output key IS its node name, edited via the `name` field above.
  if (armCtx && !armCtx.isElse) {
    if (armCtx.block.kind === "parallel") {
      pane.appendChild(el("h3", null, "parallel branch"));
      pane.appendChild(el("p", "hint", "A branch of parallel “" + armCtx.block.name + "”. Its collect / wait-one output key is this node's own name — edit it in the name field above; there is no separate branch name."));
    } else {
      pane.appendChild(el("h3", null, "branch arm (" + (armCtx.index + 1) + " of " + armCtx.block.arms.length + ")"));
      condEditor("this arm's `when` (belongs to the arm)", () => armCtx.arm.when, nc => { armCtx.arm.when = nc; },
        "The condition is the arm's, not the Branch node “" + armCtx.block.name + "”'s. Sibling arms are first-match-wins; the else node is the fallback.");
    }
  } else if (armCtx && armCtx.isElse) {
    pane.appendChild(el("h3", null, "branch else fallback"));
    pane.appendChild(el("p", "hint", "Runs when no arm's `when` matched, in Branch node “" + armCtx.block.name + "”. It is a plain node with no condition of its own."));
  }

  // Editable affordances the properties pane owns (mirror what's inline, for the drill-down variant especially).
  if (node.kind === "parallel") {
    pane.appendChild(Object.assign(el("label"), { textContent: "join mode" }));
    const sel = el("select"); ["collect","wait-one","do-not-wait"].forEach(j => { const o = el("option", null, j); if (j === node.join) o.selected = true; sel.appendChild(o); });
    sel.onchange = () => { node.join = sel.value; toast("join → " + sel.value); rerender(); };
    pane.appendChild(sel);
    const modeHelp = { collect: "waits every branch, lands all publishes, outputs {branch: output}.",
      "wait-one": "races branches; first-to-succeed wins; losers cancelled (sibling-succeeded).",
      "do-not-wait": "launches all, waits none; successor runs immediately; branches may not publish." };
    pane.appendChild(el("p", "hint", modeHelp[node.join]));
  }
  if (node.kind === "while-do") {
    condEditor("loop condition (keeps iterating while true)", () => node.condition, nc => { node.condition = nc; },
      "A structured Condition — the same builder as a branch arm and a checkpoint.");
    pane.appendChild(Object.assign(el("label"), { textContent: "max-iterations (mandatory bound)" }));
    const inp = el("input"); inp.type = "number"; inp.min = 1; inp.value = node.maxIter;
    inp.onchange = () => { node.maxIter = Math.max(1, +inp.value || 1); toast("max-iter → " + node.maxIter); rerender(); };
    pane.appendChild(inp);
    pane.appendChild(el("p", "hint", "Loop condition AND a max-iterations cap — both required. Exceeding the cap fails the run; no unbounded loop is expressible."));
  }
  if (node.kind === "branch") {
    // The Branch node owns only the arm ORDER + the else fallback — not the conditions. Each arm's
    // `when` is edited on the arm itself (select the arm's node). Shown read-only here for orientation.
    pane.appendChild(Object.assign(el("label"), { textContent: "arms (first match wins) — select an arm to edit its when" }));
    const list = el("div"); list.style.margin = "4px 0";
    node.arms.forEach((a, i) => { const r = el("div", "cond-preview"); r.textContent = (i + 1) + ". when " + condSummary(a.when) + "  →  " + a.node.name; list.appendChild(r); });
    if (node.else) { const r = el("div", "cond-preview"); r.style.opacity = ".8"; r.textContent = "else  →  " + node.else.name; list.appendChild(r); }
    pane.appendChild(list);
    pane.appendChild(el("p", "hint", "A branch arm is self-contained, like a parallel branch: its condition lives on the arm, not on this node. The Branch node holds only the arm order and the else fallback."));
  }
  if (node.kind === "checkpoint") {
    condEditor("assertion (true continues, false fails the run)", () => node.condition, nc => { node.condition = nc; },
      "A checkpoint is an inline node with no worker; its assertion is a structured Condition. Judgement checks are a step that outputs a verdict + a checkpoint that tests it.");
  }
  // Structure — add / delete / reorder — lives on the CANVAS, not here (content vs structure split).
  // The pane only edits this node's own fields. Delete via the × on a node or the Delete key.
  pane.appendChild(el("p", "hint", "Variant " + variant + " · edits are in-memory only. Structure (delete, reorder, add) is done on the canvas: the × on a node, or the Delete key."));
  return pane;
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
//  Variant plumbing: ?variant=, floating bar, arrow keys.
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
const VARIANTS = {
  A: { name: "Drill-down", sub: "one level at a time (2026-08-19 amendment)", render: renderA },
  B: { name: "Scratch snap", sub: "all nesting inline & visible (2026-08-21 proposal)", render: renderB },
  C: { name: "Hybrid", sub: "inline within a file, drill-down across ref boundary", render: renderC },
};
const ORDER = ["A", "B", "C"];
function currentVariant() { const p = new URLSearchParams(location.search).get("variant"); return VARIANTS[p] ? p : "A"; }
function rerender() {
  const v = currentVariant();
  document.getElementById("chrome-variant").textContent = "variant " + v;
  document.getElementById("chrome-file").textContent = v === "C" ? cFileStack[cFileStack.length - 1].name : "release-pipeline.workflow.json";
  const lbl = document.getElementById("switch-lbl");
  lbl.innerHTML = `<b>${v} — ${VARIANTS[v].name}</b><small>${VARIANTS[v].sub}</small>`;
  VARIANTS[v].render(document.getElementById("stage"));
}
function setVariant(v) { const u = new URL(location); u.searchParams.set("variant", v); history.replaceState(null, "", u); selectedId = null; aStack = [MODEL]; cFileStack = [{ name: "release-pipeline.workflow.json", body: MODEL }]; rerender(); }
function cycle(dir) { const i = ORDER.indexOf(currentVariant()); setVariant(ORDER[(i + dir + ORDER.length) % ORDER.length]); }

document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
  if ((e.key === "Delete" || e.key === "Backspace") && selectedId) { e.preventDefault(); deleteSelected(selectedId); }
});
rerender();
</script>
