<title>PATH — awaiting / Complete surfaces prototype</title>
<!--
  THROWAWAY PROTOTYPE — issue #470 (Viewer + Designer surfaces for `awaiting` and Complete).
  Vanilla JS, no build step, fake data. Double-click to open, or `pnpm --filter @path/viewer exec vite preview`
  is NOT needed — this is a file:// page.

  QUESTION (#470): what should the awaiting-status display, the Complete button, and the Complete
  form look like — in the Viewer run surface AND in the Designer (authoring node + run dock)?

  Three structurally-different answers, switchable via ?variant=A|B|C and the floating bottom bar.
  The axis of variation is WHERE THE COMPLETE ACTION + FORM LIVE:
    A — inline in the run detail panel   (calm, embedded)
    B — an "Awaiting" inbox drawer       (task-centric, multi-await, ADR 0042)
    C — a rail CTA that opens a modal     (action-forward)
  A second toggle (?surface=viewer|designer) shows both surfaces per variant, because the Designer
  reuses the Viewer's run panels (ADR 0031) — the Complete form must read identically in both.

  Real build reuses the DECISIONS, not this code.

  Domain facts pinned into the mock (do not "fix" these — they are the spec):
    - awaiting glyph ⏳, purple #8250df / bg #fbefff. Leaf-only: the parent run stays `running` ◐ (ADR 0038).
    - person-activity fields: description (required, interpolable), outputSchema (optional JSON Schema
      object), assignee (optional, informational string). (CONTEXT.md · person-activity)
    - Complete form is built from outputSchema; invalid output -> 400, step STAYS awaiting for a retry;
      valid output -> succeeded, run continues. POST /v0/runs/:step_run_id/complete (ADR 0039/0040).
    - person-activity has NO canvas hue today (falls back to --k-step indigo, same as prompt/binary).
      Giving it its own identity is one of the questions — each variant answers differently.
-->
<style>

  }

<script>
/* ================= fake data ================= */
const GLYPH = { running:"◐", awaiting:"⏳", succeeded:"✓", failed:"✕", cancelled:"⊘", pending:"◌", paused:"⏸" };

// person-activity node type fields (CONTEXT.md). description is interpolable; shown resolved against run config.
const NODE = {
  id: "legal-signoff",
  type: "person-activity",
  descriptionRaw: "Review the generated contract for {{client.name}} and record your decision.",
  descriptionResolved: 'Review the generated contract for <span class="interp">Acme GmbH</span> and record your decision.',
  assignee: "legal@acme.co",
  outputSchema: {
    type: "object",
    required: ["approved", "reviewer", "riskLevel"],
    properties: {
      approved:  { type: "boolean", title: "Approved", description: "Tick if the contract is cleared to send." },
      reviewer:  { type: "string",  title: "Reviewer name" },
      riskLevel: { type: "string",  title: "Risk level", enum: ["low","medium","high"] },
      notes:     { type: "string",  title: "Notes", description: "Optional context for the record." }
    }
  }
};

// a run tree: root `running` (parent never awaits — ADR 0038); one succeeded leaf, the awaiting person leaf, one pending.
const RUN = {
  root: { id:"run_root", name:"onboarding-review", type:"workflow", status:"running" },
  leaves: [
    { id:"sr_draft",  name:"draft-contract",  type:"prompt",          kindtag:"LLM",     status:"succeeded" },
    { id:"sr_legal",  name:"legal-signoff",   type:"person-activity", kindtag:"PERSON",  status:"awaiting", assignee:NODE.assignee, node:NODE },
    { id:"sr_send",   name:"send-contract",   type:"binary",          kindtag:"COMMAND", status:"pending" }
  ]
};
// second awaiting leaf (parallel join) — only variant B surfaces the multi-await inbox (ADR 0042).
const SECOND_AWAIT = { id:"sr_finance", name:"finance-approval", type:"person-activity", kindtag:"PERSON",
  status:"awaiting", assignee:"cfo@acme.co",
  node:{ ...NODE, id:"finance-approval", descriptionResolved:'Approve the budget line for <span class="interp">Acme GmbH</span>.',
         outputSchema:{ type:"object", required:["approved"], properties:{ approved:{type:"boolean",title:"Approved"},
         amount:{type:"number",title:"Approved amount (EUR)"} } } } };

/* ================= app state ================= */
const params = new URLSearchParams(location.search);
const VARIANTS = ["A","B","C"];
const VNAMES = { A:"Inline detail form", B:"Awaiting inbox drawer", C:"Rail CTA + modal" };
const state = {
  variant: (params.get("variant")||"A").toUpperCase(),
  surface: params.get("surface")||"viewer",
  selected: "sr_legal",
  lastPost: null       // surfaced state: the last POST /complete payload + engine reply
};
if (!VARIANTS.includes(state.variant)) state.variant = "A";

/* ================= schema -> form generator (shared logic; the CONTAINER differs per variant) =========
   Renders JSON Schema object properties as form inputs, validates on submit, shows inline errors.
   Returns { el, read, validateAndPost }. */
function buildCompleteForm(leaf, opts={}) {
  const schema = leaf.node.outputSchema;
  const props = schema.properties || {};
  const required = new Set(schema.required || []);
  const wrap = document.createElement("div");

  for (const [key, p] of Object.entries(props)) {
    const f = document.createElement("div"); f.className = "form-field"; f.dataset.key = key;
    const title = p.title || key;
    const isBool = p.type === "boolean";
    const isEnum = Array.isArray(p.enum);
    const isNum  = p.type === "number" || p.type === "integer";
    let control;
    if (isBool) {
      control = `<div class="cbrow"><input type="checkbox" id="fld_${key}"><label for="fld_${key}" style="margin:0;font-weight:500">${title}</label></div>`;
    } else if (isEnum) {
      control = `<select id="fld_${key}"><option value="">— select —</option>${p.enum.map(o=>`<option>${o}</option>`).join("")}</select>`;
    } else if (isNum) {
      control = `<input type="number" id="fld_${key}">`;
    } else {
      control = key === "notes"
        ? `<textarea id="fld_${key}"></textarea>`
        : `<input type="text" id="fld_${key}">`;
    }
    const lbl = isBool ? "" :
      `<label for="fld_${key}">${title}${required.has(key)?'<span class="req">*</span>':''}</label>`;
    const help = p.description ? `<p class="desc">${p.description}</p>` : "";
    f.innerHTML = `${lbl}${help}${control}<p class="err"></p>`;
    wrap.appendChild(f);
  }

  function read() {
    const out = {};
    for (const [key, p] of Object.entries(props)) {
      const el = wrap.querySelector(`#fld_${key}`);
      if (p.type === "boolean") out[key] = el.checked;
      else if (p.type === "number" || p.type === "integer") out[key] = el.value === "" ? undefined : Number(el.value);
      else out[key] = el.value.trim() === "" ? undefined : el.value.trim();
    }
    return out;
  }

  // mirrors what ajv would refuse at the engine (ADR 0040): required + enum + type. Client pre-check;
  // the engine is still the authority (400 keeps the step awaiting for a retry).
  function validate(out) {
    const errs = {};
    for (const key of required) {
      const v = out[key];
      if (v === undefined || v === "" || (props[key].type === "boolean" && v === false && props[key].mustBeTrue)) {
        errs[key] = "This field is required.";
      }
    }
    for (const [key, p] of Object.entries(props)) {
      const v = out[key];
      if (v === undefined) continue;
      if (Array.isArray(p.enum) && !p.enum.includes(v)) errs[key] = `Must be one of: ${p.enum.join(", ")}.`;
      if ((p.type === "number"||p.type==="integer") && typeof v !== "number") errs[key] = "Must be a number.";
    }
    return errs;
  }

  function paint(errs) {
    wrap.querySelectorAll(".form-field").forEach(f => {
      const key = f.dataset.key;
      f.classList.toggle("invalid", !!errs[key]);
      f.querySelector(".err").textContent = errs[key] || "";
    });
  }

  function submit(statusEl) {
    const out = read();
    const errs = validate(out);
    paint(errs);
    if (Object.keys(errs).length) {
      if (statusEl){ statusEl.textContent = "400 — output rejected, step stays awaiting"; statusEl.className = "form-status bad"; }
      state.lastPost = { request:{ method:"POST", path:`/v0/runs/${leaf.id}/complete`, body:{ output: out } },
                         reply:{ status:400, error:"schema validation failed", fields:errs } };
      renderStateReadout();
      return false;
    }
    // valid — engine writes the blob, leaf -> succeeded, run continues (ADR 0039)
    leaf.status = "succeeded";
    state.lastPost = { request:{ method:"POST", path:`/v0/runs/${leaf.id}/complete`, body:{ output: out } },
                       reply:{ status:200, stepStatus:"succeeded", runStatus:"running" } };
    if (statusEl){ statusEl.textContent = "200 — completed, run continues"; statusEl.className = "form-status ok"; }
    if (opts.onDone) opts.onDone();
    renderStateReadout();
    return true;
  }

  return { el: wrap, submit };
}

function personSvg(size=13){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <circle cx="12" cy="7" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>`;
}
function initials(email){ return (email||"?").slice(0,2).toUpperCase(); }
function pill(status){ return `<span class="pill" data-status="${status}"><span class="g">${GLYPH[status]}</span>${status}</span>`; }

/* ================= run tree rail (shared shell, per-variant awaiting affordance) ================= */
function railHtml(opts={}) {
  const rows = [];
  const badge = opts.count ? `<span class="count-badge">${opts.count} awaiting</span>` : "";
  rows.push(`<div class="treerow" data-id="${RUN.root.id}" aria-selected="${state.selected===RUN.root.id}">
    <span class="gd running">${GLYPH.running}</span>
    <span class="nm">${RUN.root.name}<span class="kindtag">WORKFLOW</span></span>${badge}</div>`);
  for (const leaf of railLeaves(opts)) {
    const sel = state.selected === leaf.id;
    const strip = leaf.status === "awaiting" ? "awaiting-strip" : "";
    let trailing = "";
    if (leaf.status === "awaiting") {
      if (opts.railCta) trailing = `<button class="btn primary small" data-complete="${leaf.id}">Complete</button>`;
      else trailing = `<span class="chip"><span class="who">${initials(leaf.assignee)}</span>${leaf.assignee||"unassigned"}</span>`;
    }
    rows.push(`<div class="treerow ${strip}" style="padding-left:26px" data-id="${leaf.id}" aria-selected="${sel}">
      <span class="gd ${leaf.status}">${GLYPH[leaf.status]}</span>
      <span class="nm">${leaf.name}<span class="kindtag">${leaf.kindtag}</span></span>${trailing}</div>`);
  }
  return `<section class="rail panel"><div class="panel-h">Run tree · ${pill("running")} <span class="muted" style="margin-left:auto;font-weight:400">root stays running (ADR 0038)</span></div>
    <div class="panel-b" style="padding:6px">${rows.join("")}</div></section>`;
}
function railLeaves(opts){ return opts.withSecond ? [RUN.leaves[0], RUN.leaves[1], SECOND_AWAIT, RUN.leaves[2]] : RUN.leaves; }

/* ================= VARIANT A — inline detail form ================= */
function renderA_viewer() {
  const leaf = currentLeaf();
  const detail = leaf.status === "awaiting" ? awaitingDetailInline(leaf) : readonlyDetail(leaf);
  return `<div class="cols">${railHtml()}<div class="grow">${detail}</div></div>`;
}
function awaitingDetailInline(leaf) {
  return `<section class="panel"><div class="panel-h">${leaf.name} ${pill("awaiting")}
      <span class="chip" style="margin-left:auto"><span class="who">${initials(leaf.assignee)}</span>${leaf.assignee}</span></div>
    <div class="panel-b">
      <div class="callout">${leaf.node.descriptionResolved}</div>
      <h3 style="margin:18px 0 10px;font-size:var(--fs-md)">Complete this activity</h3>
      <div id="formHost"></div>
    </div></section>`;
}
function renderA_designer() {
  return `${designerCanvas("A")}${designerRunDock("inline")}`;
}

/* ================= VARIANT B — awaiting inbox drawer ================= */
function renderB_viewer() {
  const leaf = currentLeaf();
  const awaits = railLeaves({withSecond:true}).filter(l=>l.status==="awaiting");
  // No docked inbox: pick an awaiting step in the rail; its detail panel carries the Complete button,
  // which opens the slide-over form.
  const detail = leaf.status === "awaiting" ? awaitingDetailWithButton(leaf) : readonlyDetail(leaf);
  return `<div class="cols">
    ${railHtml({withSecond:true, count:awaits.length})}
    <div class="grow">${detail}</div></div>`;
}
// awaiting detail with a Complete button (variant B) — button opens the slide-over form.
function awaitingDetailWithButton(leaf) {
  return `<section class="panel"><div class="panel-h">${leaf.name} ${pill("awaiting")}
      <span class="chip" style="margin-left:auto"><span class="who">${initials(leaf.assignee)}</span>${leaf.assignee}</span></div>
    <div class="panel-b">
      <div class="callout">${leaf.node.descriptionResolved}</div>
      <div class="kv" style="margin-top:14px"><span class="k">step run id</span><span class="mono">${leaf.id}</span></div>
      <div class="kv"><span class="k">assignee</span><span>${leaf.assignee} <span class="muted">(informational only)</span></span></div>
      <div class="form-actions" style="margin-top:16px"><button class="btn primary" data-open="${leaf.id}">Complete this activity</button></div>
    </div></section>`;
}
function renderB_designer() {
  return `${designerCanvas("B")}${designerRunDock("inbox")}`;
}
function openSlideover(leaf) {
  const so = document.getElementById("slideover");
  so.innerHTML = `<div class="ov-h">${personSvg(14)} <b>${leaf.name}</b> ${pill("awaiting")}<button class="x" id="soX">×</button></div>
    <div class="ov-b">
      <div class="chip" style="margin-bottom:10px"><span class="who">${initials(leaf.assignee)}</span>${leaf.assignee}</div>
      <div class="callout" style="margin-bottom:16px">${leaf.node.descriptionResolved}</div>
      <div id="soForm"></div></div>`;
  const f = buildCompleteForm(leaf, { onDone: () => { closeOverlays(); render(); } });
  const st = document.createElement("div"); st.className = "form-status";
  const actions = document.createElement("div"); actions.className = "form-actions";
  const submit = document.createElement("button"); submit.className = "btn primary"; submit.textContent = "Submit completion";
  actions.append(submit, st);
  so.querySelector("#soForm").append(f.el, actions);
  submit.onclick = () => f.submit(st);
  so.querySelector("#soX").onclick = closeOverlays;
  so.classList.add("open"); so.setAttribute("aria-hidden","false");
  document.getElementById("scrim").classList.add("open");
}

/* ================= VARIANT C — rail CTA + modal ================= */
function renderC_viewer() {
  const leaf = currentLeaf();
  const detail = leaf.status === "awaiting" ? readonlyAwaitingDetail(leaf, true) : readonlyDetail(leaf);
  return `<div class="cols">${railHtml({railCta:true})}<div class="grow">${detail}</div></div>`;
}
function renderC_designer() {
  return `${designerCanvas("C")}${designerRunDock("modal")}`;
}
function openModal(leaf) {
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="ov-h">${personSvg(14)} <b>${leaf.name}</b> ${pill("awaiting")}<button class="x" id="mX">×</button></div>
    <div class="ov-b">
      <div class="chip" style="margin-bottom:10px"><span class="who">${initials(leaf.assignee)}</span>${leaf.assignee}</div>
      <div class="callout" style="margin-bottom:16px">${leaf.node.descriptionResolved}</div>
      <div id="mForm"></div></div>`;
  const f = buildCompleteForm(leaf, { onDone: () => { closeOverlays(); render(); } });
  const st = document.createElement("div"); st.className = "form-status";
  const actions = document.createElement("div"); actions.className = "form-actions";
  const cancel = document.createElement("button"); cancel.className = "btn"; cancel.textContent = "Cancel";
  const submit = document.createElement("button"); submit.className = "btn primary"; submit.textContent = "Submit completion";
  actions.append(cancel, submit, st);
  m.querySelector("#mForm").append(f.el, actions);
  submit.onclick = () => f.submit(st);
  cancel.onclick = closeOverlays;
  m.querySelector("#mX").onclick = closeOverlays;
  m.classList.add("open");
  document.getElementById("scrim").classList.add("open");
}

/* ================= shared detail renderers ================= */
function readonlyDetail(leaf) {
  return `<section class="panel"><div class="panel-h">${leaf.name} ${pill(leaf.status)}</div>
    <div class="panel-b"><div class="kv"><span class="k">type</span><span class="mono">${leaf.type}</span></div>
    <div class="kv"><span class="k">step run id</span><span class="mono">${leaf.id}</span></div>
    <p class="muted" style="margin-top:12px">Read-only inspection. No action for a ${leaf.status} step.</p></div></section>`;
}
function readonlyAwaitingDetail(leaf, withState) {
  return `<section class="panel"><div class="panel-h">${leaf.name} ${pill("awaiting")}
      <span class="chip" style="margin-left:auto"><span class="who">${initials(leaf.assignee)}</span>${leaf.assignee}</span></div>
    <div class="panel-b">
      <div class="callout">${leaf.node.descriptionResolved}</div>
      <div class="kv" style="margin-top:14px"><span class="k">step run id</span><span class="mono">${leaf.id}</span></div>
      <div class="kv"><span class="k">assignee</span><span>${leaf.assignee} <span class="muted">(informational only)</span></span></div>
      <p class="muted" style="margin-top:10px">${withState ? "Use the ⟨Complete⟩ button in the rail to submit output." : "Open the Awaiting inbox to complete."}</p>
    </div></section>`;
}

/* ================= designer canvas + node editor ================= */
function designerCanvas(v) {
  const nodes = [
    { cls:"k-step",   icon:"∑", title:"draft-contract",  sub:"An LLM prompt run against a model.",            tag:"LLM" },
    { cls:"k-step",   icon:"›_", title:"send-contract",  sub:"A command run with arguments.",                 tag:"COMMAND" },
    { cls:"k-person", icon:personSvg(13), title:"legal-signoff", sub:"Suspends the run for a human action.",  tag:"PERSON", sel:true, aw:true }
  ];
  const blocks = nodes.map((n,i) => {
    const sel = n.sel ? `aria-selected="true"` : "";
    const aw = (v==="C" && n.aw) ? "awaitable" : "";
    const edge = i < nodes.length-1 ? `<div class="edge"></div>` : "";
    return `<div class="node ${n.cls} ${aw}" ${sel} data-node="${n.title}">
        <div class="ntitle"><span class="kicon">${n.icon}</span>${n.title}<span class="ktag">${n.tag}</span></div>
        <div class="nsub">${n.sub}</div></div>${edge}`;
  }).join("");
  const idNote = {
    A:"person-activity gets its own hue (teal) + a person glyph — filled node. Distinct from the indigo prompt/binary steps.",
    B:"person-activity reads as a human GATE — a clipped/hexagon shape breaks the rectangle rhythm of the step nodes.",
    C:"person-activity keeps the step rectangle but gains a teal accent bar; when running-and-awaitable it gets an outline ring."
  }[v];
  return `<div class="cols">
    <div class="grow"><section class="panel"><div class="panel-h">Canvas · workflow authoring</div>
      <div class="panel-b vProto"><div class="canvas ${'v'+v}">${blocks}</div>
      <p class="stage-note" style="margin-top:10px">${idNote}</p></div></section></div>
    <section class="rail panel"><div class="panel-h">Node editor · person-activity</div>
      <div class="panel-b">${nodeEditor()}</div></section></div>`;
}
function nodeEditor() {
  return `
    <div class="form-field"><label>description <span class="req">*</span></label>
      <p class="desc">Instructions shown to the person. Interpolable (<span class="mono">{{client.name}}</span>).</p>
      <textarea>${NODE.descriptionRaw}</textarea></div>
    <div class="form-field"><label>outputSchema</label>
      <p class="desc">JSON Schema object. The Complete form is built from this. Empty = any JSON accepted.</p>
      <textarea class="mono" style="min-height:120px">${JSON.stringify(NODE.outputSchema,null,2)}</textarea>
      <div class="form-actions"><button class="btn small">Raw JSON</button><button class="btn small">Field editor</button></div></div>
    <div class="form-field"><label>assignee</label>
      <p class="desc">Informational label. No enforcement.</p>
      <input type="text" value="${NODE.assignee}"></div>`;
}
function designerRunDock(kind) {
  const map = {
    inline:"During a run, the awaiting step's Complete form renders inline in this run dock — the SAME panel the Viewer shows (ADR 0031).",
    inbox:"During a run, the awaiting step's detail panel carries a Complete button that opens the SAME slide-over form the Viewer uses (ADR 0031).",
    modal:"During a run, a Complete button on the awaiting node opens the SAME modal form the Viewer uses (ADR 0031)."
  };
  const leaf = RUN.leaves[1];
  const showBtn = leaf.status === "awaiting"
    ? `<button class="btn primary small" id="dockAction">Open Complete form</button>`
    : `<span class="form-status ok">completed — run continues</span>`;
  return `<section class="panel" style="margin-top:16px"><div class="panel-h">Run dock (reused Viewer panels)</div>
    <div class="panel-b"><div class="rundock-note">${map[kind]}</div>
      <div class="cols" style="align-items:center"><span class="pill" data-status="${leaf.status}"><span class="g">${GLYPH[leaf.status]}</span>${leaf.name}</span>
      <div style="flex:1"></div>${showBtn}</div>
      <div id="dockForm" style="margin-top:14px"></div></div></section>`;
}

/* ================= state readout ================= */
function renderStateReadout() {
  const host = document.getElementById("stateReadout");
  if (!host) return;
  const payload = state.lastPost || { note:"no Complete submitted yet — fill the form and submit" };
  host.innerHTML = `<pre>${JSON.stringify(payload,null,2)}</pre>`;
}

/* ================= render dispatch ================= */
function currentLeaf(){ return railLeaves({withSecond:true}).find(l=>l.id===state.selected) || RUN.leaves[1]; }

function render() {
  document.querySelectorAll("#surfaceSeg button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.surface === state.surface)));
  document.getElementById("vlabelTop").textContent = `Variant ${state.variant} — ${VNAMES[state.variant]} · ${state.surface}`;
  document.getElementById("swlabel").innerHTML = `<b>${state.variant}</b> — ${VNAMES[state.variant]}`;

  const key = state.variant + "_" + state.surface;
  const R = {
    A_viewer:renderA_viewer, A_designer:renderA_designer,
    B_viewer:renderB_viewer, B_designer:renderB_designer,
    C_viewer:renderC_viewer, C_designer:renderC_designer
  }[key];

  const note = state.surface === "viewer"
    ? "Viewer run surface. Select the ⏳ awaiting leaf. The question: where does Complete live?"
    : "Designer authoring surface. Node identity + node editor + run dock (reuses the Viewer form, ADR 0031).";
  document.getElementById("stage").innerHTML =
    `<p class="stage-note">${note}</p>${R()}
     <div class="state"><h3 style="font-size:var(--fs-sm);color:var(--text-2);margin-bottom:6px">last POST /v0/runs/:step_run_id/complete</h3>
     <div id="stateReadout"></div></div>`;
  renderStateReadout();
  wire();
}

function wire() {
  // tree selection
  document.querySelectorAll(".treerow[data-id]").forEach(r => r.onclick = e => {
    if (e.target.closest("[data-complete]")) return;
    state.selected = r.dataset.id; render();
  });
  // variant A: mount inline form
  const fh = document.getElementById("formHost");
  if (fh) {
    const leaf = currentLeaf();
    const f = buildCompleteForm(leaf, { onDone: render });
    const st = document.createElement("div"); st.className = "form-status";
    const actions = document.createElement("div"); actions.className = "form-actions";
    const submit = document.createElement("button"); submit.className = "btn primary"; submit.textContent = "Submit completion";
    actions.append(submit, st);
    fh.append(f.el, actions);
    submit.onclick = () => f.submit(st);
  }
  // variant B inbox = picker: select the awaiting step; its Complete form renders in the detail panel
  document.querySelectorAll("[data-select]").forEach(el => el.onclick = () => {
    state.selected = el.dataset.select; render();
  });
  // variant B inbox openers (legacy slide-over path, unused by the viewer now; kept for reference)
  document.querySelectorAll("[data-open]").forEach(el => el.onclick = () => {
    const leaf = railLeaves({withSecond:true}).find(l=>l.id===el.dataset.open);
    openSlideover(leaf);
  });
  // variant C rail CTA
  document.querySelectorAll("[data-complete]").forEach(b => b.onclick = () => {
    const leaf = railLeaves({withSecond:true}).find(l=>l.id===b.dataset.complete);
    openModal(leaf);
  });
  // designer run dock action (mirrors the variant's viewer affordance, ADR 0031)
  const dockBtn = document.getElementById("dockAction");
  if (dockBtn) dockBtn.onclick = () => {
    const leaf = RUN.leaves[1];
    if (state.variant === "A") {
      const host = document.getElementById("dockForm");
      host.innerHTML = "";
      const f = buildCompleteForm(leaf, { onDone: render });
      const st = document.createElement("div"); st.className = "form-status";
      const actions = document.createElement("div"); actions.className = "form-actions";
      const submit = document.createElement("button"); submit.className = "btn primary"; submit.textContent = "Submit completion";
      actions.append(submit, st); host.append(f.el, actions); submit.onclick = () => f.submit(st);
    } else if (state.variant === "B") openSlideover(leaf);
    else openModal(leaf);
  };
}

/* ================= chrome + switcher ================= */
function closeOverlays() {
  document.getElementById("scrim").classList.remove("open");
  const so = document.getElementById("slideover");
  const m = document.getElementById("modal");
  so.classList.remove("open"); m.classList.remove("open");
  // blank the containers so a hidden overlay's `fld_*` inputs cannot collide with a visible form's ids
  so.innerHTML = ""; m.innerHTML = "";
}
document.getElementById("scrim").onclick = closeOverlays;

document.querySelectorAll("#surfaceSeg button").forEach(b => b.onclick = () => {
  state.surface = b.dataset.surface; syncUrl(); render();
});
function setVariant(v){ state.variant = v; state.selected = "sr_legal"; RUN.leaves[1].status = "awaiting"; syncUrl(); closeOverlays(); render(); }
function cycle(d){ const i = VARIANTS.indexOf(state.variant); setVariant(VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length]); }
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
function syncUrl(){ const p = new URLSearchParams({ variant:state.variant, surface:state.surface });
  try { history.replaceState(null,"",`?${p}`); } catch { /* data:/file: snapshot origins refuse replaceState — ignore, state still drives render */ } }
document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
  if (e.key === "Escape") closeOverlays();
});

render();
</script>
